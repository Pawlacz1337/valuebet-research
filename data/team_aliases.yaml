# Kanoniczne drużyny i ich aliasy.
#
# Aliasy dopisujemy RĘCZNIE, po przejrzeniu raportu z
# TeamResolver.report_unresolved(). Fuzzy matching generuje sugestie,
# nigdy nie zatwierdza sam (reguła 15 w CLAUDE.md).
#
# Uwaga na pary, które fuzzy skleja, a które są różnymi klubami:
#   Ruch Chorzów        vs  Ruch Radzionków
#   Górnik Zabrze       vs  Górnik Łęczna
#   Stal Mielec         vs  Stal Rzeszów
#   Wisła Kraków        vs  Wisła Płock
# Dlatego nazwa miasta jest częścią klucza i nie wolno jej skracać.

