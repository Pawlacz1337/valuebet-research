name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # Projekt rozwijany na Windows — CI na tym samym systemie.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --group dev

      - name: Tests (without local data)
        run: uv run pytest -m "not needs_data"

      - name: Ruff
        run: uv run ruff check

      - name: Mypy
        run: uv run mypy src
