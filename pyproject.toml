[project]
name = "valuebet"
version = "0.1.0"
description = "Model probabilistyczny +EV dla polskiego rynku bukmacherskiego"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17.0", # parquet w data/
    "scipy>=1.14",
    "httpx>=0.27", # async polling, NIE requests
    "pydantic>=2.9", # kanoniczne modele Match/Selection/Odds
    "python-dotenv>=1.0",
    "rapidfuzz>=3.10", # normalizacja nazw drużyn
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
models = [
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "statsmodels>=0.14",
]
bayes = [
    "pymc>=5.17",             # hierarchiczne modele dla lig z małym sample
    "arviz>=0.20",
]
viz = [
    "matplotlib>=3.9",
]
scrape = [
    "playwright>=1.48",       # TYLKO do rozpoznania API i odświeżania sesji
    "selectolax>=0.3.21",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "ipykernel>=6.29",
    "types-pyyaml>=6.0.12.20260906",
    "pandas-stubs>=3.0.5.260914",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/valuebet"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
# Skrypty dowodowe audytu FSA #1 — archiwum, kopiowane dosłownie, nie kod produkcyjny.
# Skrypt wykresów studium przypadku — wklejony dosłownie, nie kod produkcyjny.
extend-exclude = ["reports/evidence", "docs/case-study/make_charts.py"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "SIM",       # simplify
    "PD",        # pandas-vet
    "NPY",       # numpy
    "RUF",
    "ARG",       # nieużywane argumenty
    "PTH",       # pathlib zamiast os.path
    "TRY",       # obsługa wyjątków
    "DTZ",       # naiwne datetime -- krytyczne przy look-ahead bias
]
ignore = [
    "E501",      # długość linii pilnuje formatter
    "TRY003",    # długie komunikaty w wyjątkach są tu pożądane
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PD901"]

[tool.ruff.lint.isort]
known-first-party = ["valuebet"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: testy wolne (pełne przebiegi backtestu)",
    "network: testy wymagające sieci (domyślnie pomijane w CI)",
    "needs_data: testy wymagające plików lokalnych (data/raw, reports/backtest_fin, .env); CI: -m 'not needs_data'. Stan 2026-11-13: 0 takich testów",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/valuebet"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
